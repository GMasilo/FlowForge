# Add inside the HTTPS VirtualHost, not .htaccess.
# Requires mod_proxy and mod_proxy_http. Start the Node service first.
# Keep HOST=127.0.0.1 and PORT=8091 on the same server as Apache.
ProxyPassMatch "^/flowforge/api/intent/(classify|sentiment|similarity|health|image/classify)$" "http://127.0.0.1:8091/$1"
ProxyPassReverse "/flowforge/api/intent/" "http://127.0.0.1:8091/"

# Do not expose source, package files, or node_modules via the document root.
<LocationMatch "^/flowforge/api/intent(?:/(?!classify$|sentiment$|similarity$|health$|image/classify$).*)?$">
    Require all denied
</LocationMatch>
